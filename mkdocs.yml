site_name: Open Pattern Format
site_url: https://docs.openpatternformat.com
copyright: Copyright &copy; 2024 Scott Ware
theme:
  name: material
  logo: assets/opaf_icon.png
  favicon: assets/opaf_icon.png
  palette:
    scheme: default
    primary: custom
  features:
    - content.code.copy
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - navigation.path
extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://openpatternformat.com
      name: Website
    - icon: fontawesome/brands/github
      link: https://github.com/open-pattern-format
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/openpatternproject

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
    - Overview: getting_started/overview.md
  - Pattern Manager:
    - Overview: pattern_manager/overview.md
  - Pattern Creator:
    - Overview: pattern_creator/overview.md
  - Developers:
    - Overview: developers/overview.md
    - Pattern Specification: developers/pattern_spec.md
    - Project Specification: developers/project_spec.md
    - Packaging: developers/packaging.md
    - Functions: developers/functions.md
